<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <p>
            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                size="40"
                maxlength="40"
                placeholder="Ingrese su nombre">
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                size="40"
                maxlength="40"
                placeholder="Ingrese su apellido">
        </p>

        <p>
            Sexo:

            <label for="masculino">Masculino</label>
            <input
                type="radio"
                id="masculino"
                name="sexo"
                value="masculino"
                placeholder="Masculino">

            <label for="femenino">Femenino</label>
            <input
                type="radio"
                id="femenino"
                name="sexo"
                value="femenino"
                placeholder="Femenino">
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input
                type="number"
                id="edad"
                name="edad"
                maxlength="3"
                placeholder="Edad">
        </p>

        <p>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                size="40"
                maxlength="50"
                placeholder="Ingrese su email">
        </p>

        <p>
            <label for="usuario">Usuario:</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                size="40"
                maxlength="40"
                placeholder="Ingrese su usuario">
        </p>

        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                maxlength="20"
                placeholder="Ingrese su password">
        </p>

        <p>
            <label for="confirmarPassword">Confirmar Password:</label>
            <input
                type="password"
                id="confirmarPassword"
                name="confirmarPassword"
                maxlength="20"
                placeholder="Confirme su password">
        </p>

        <p>
            <label for="servicio">Tipo de servicio:</label>
            <select id="servicio" name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema:

            <input
                type="checkbox"
                id="politica"
                name="tema"
                value="politica"
                placeholder="Política">
            <label for="politica">Política</label>

            <input
                type="checkbox"
                id="negocios"
                name="tema"
                value="negocios"
                placeholder="Negocios">
            <label for="negocios">Negocios</label>

            <input
                type="checkbox"
                id="tecnologia"
                name="tema"
                value="tecnologia"
                placeholder="Tecnología">
            <label for="tecnologia">Tecnología</label>

            <input
                type="checkbox"
                id="salud"
                name="tema"
                value="salud"
                placeholder="Salud">
            <label for="salud">Salud</label>
        </p>

        <p>
            <label for="comentario">Agregue un comentario:</label>
            <textarea
                id="comentario"
                name="comentario"
                rows="5"
                cols="40"
                placeholder="Ingrese un comentario"></textarea>
        </p>

        <p>
            <input
                type="submit"
                value="Enviar"
                placeholder="Enviar">
        </p>

    </form>

</body>

</html>
