<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <!-- Cree un Formulario con los campos que se proponen a continuacion -->
    <!-- Agregue el atributo legend -->

    <!-- Si tienes dudas de como hacer un formulario, puedes consultar:
        https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output -->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <p>
            Nombre:
            <input
                type="text"
                name="nombre"
                size="40"
                maxlength="40"
                placeholder="Ingrese su nombre">
        </p>

        <p>
            Apellido:
            <input
                type="text"
                name="apellido"
                size="40"
                maxlength="40"
                placeholder="Ingrese su apellido">
        </p>

        <p>
            Sexo:
            Masculino
            <input
                type="radio"
                name="sexo"
                value="masculino"
                placeholder="Masculino">

            Femenino
            <input
                type="radio"
                name="sexo"
                value="femenino"
                placeholder="Femenino">
        </p>

        <p>
            Edad:
            <input
                type="number"
                name="edad"
                maxlength="3"
                placeholder="Edad">
        </p>

        <p>
            Email:
            <input
                type="email"
                name="email"
                size="40"
                maxlength="50"
                placeholder="Ingrese su email">
        </p>

        <p>
            Usuario:
            <input
                type="text"
                name="usuario"
                size="40"
                maxlength="40"
                placeholder="Ingrese su usuario">
        </p>

        <p>
            Password:
            <input
                type="password"
                name="password"
                maxlength="20"
                placeholder="Ingrese su password">
        </p>

        <p>
            Confirmar Password:
            <input
                type="password"
                name="confirmarPassword"
                maxlength="20"
                placeholder="Confirme su password">
        </p>

        <p>
            Tipo de servicio:
            <select name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema:

            <input
                type="checkbox"
                name="tema"
                value="politica"
                placeholder="Política">
            Política

            <input
                type="checkbox"
                name="tema"
                value="negocios"
                placeholder="Negocios">
            Negocios

            <input
                type="checkbox"
                name="tema"
                value="tecnologia"
                placeholder="Tecnología">
            Tecnología

            <input
                type="checkbox"
                name="tema"
                value="salud"
                placeholder="Salud">
            Salud
        </p>

        <p>
            Agregue un comentario:
            <textarea
                name="comentario"
                rows="5"
                cols="40"
                placeholder="Ingrese un comentario"></textarea>
        </p>

        <p>
            <input
                type="submit"
                value="Enviar"
                placeholder="Enviar">
        </p>

    </form>

</body>

</html>
