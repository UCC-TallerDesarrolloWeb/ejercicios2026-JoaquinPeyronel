<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mostrar/Ocultar Div</title>

    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">

    <script>
        const mostrarOcultar = (accion) => {
            const div = document.getElementsByName("unDiv")[0];

            if (accion === "mostrar") {
                div.style.display = "block";
            }

            if (accion === "ocultar") {
                div.style.display = "none";
            }
        };
    </script>
</head>

<body>

    <h1>Mostrar/Ocultar Div</h1>

    <form>
        <!-- Es importante que los 2 radio button tengan el mismo name,
             porque eso les hace pertenecer a un mismo grupo -->

        <!-- Si un radio button se selecciona, el otro se deselecciona -->

        <p>
            <input
                id="mostrarDiv"
                type="radio"
                name="rad_mostrar-ocultar"
                value="val_mostrar"
                onchange="mostrarOcultar('mostrar')">

            <label for="mostrarDiv">Mostrar Div</label>
        </p>

        <p>
            <input
                id="ocultarDiv"
                type="radio"
                name="rad_mostrar-ocultar"
                value="val_ocultar"
                onchange="mostrarOcultar('ocultar')">

            <label for="ocultarDiv">Ocultar Div</label>
        </p>
    </form>

    <div name="unDiv" class="color-div">
        <p>
            Este DIV contiene información que en ciertas ocasiones se desea ocultar.
        </p>
    </div>

</body>

</html>
