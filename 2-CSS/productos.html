<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="productos.css">
    <script src="../3-Js/tienda.js" defer></script>

    <script>
        const abrirDialog = () => {
            document.getElementById("detalleProducto").showModal();
        };

        const cerrarDialog = () => {
            document.getElementById("detalleProducto").close();
        };
    </script>
</head>

<body class="grid-container">

    <header class="item1">
        <h1>Productos</h1>
    </header>

    <nav class="item2">
        <button class="boton catalogo">Catálogo</button>
        <button class="boton carrito">Carrito de Compras</button>
    </nav>

    <aside class="item3">

        <fieldset>
            <legend>Búsqueda</legend>

            <label for="buscar">Buscar:</label>
            <input type="text" id="buscar" name="buscar">
        </fieldset>

        <fieldset>
            <legend>Precios</legend>

            <p>
                <label for="minimo">Mínimo:</label>
                <input type="number" id="minimo" name="minimo">
            </p>

            <p>
                <label for="maximo">Máximo:</label>
                <input type="number" id="maximo" name="maximo">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tipo de Productos</legend>

            <p>
                <input type="checkbox" id="protectores" name="tipo" value="protectores">
                <label for="protectores">Protectores</label>
            </p>

            <p>
                <input type="checkbox" id="entrenamiento" name="tipo" value="entrenamiento">
                <label for="entrenamiento">Entrenamiento</label>
            </p>

            <p>
                <input type="checkbox" id="doboks" name="tipo" value="doboks">
                <label for="doboks">Doboks</label>
            </p>

        </fieldset>

    </aside>

    <main class="item4 productos" id="contenedorProductos">

    </main>

    <footer class="item5">
        Pie de página
    </footer>

    <dialog id="detalleProducto">
        <h2>Detalle del Producto</h2>

        <p>
            Información del producto seleccionado.
        </p>

        <button onclick="cerrarDialog()">
            Cerrar
        </button>
    </dialog>

</body>

</html>
